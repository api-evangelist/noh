name: Noh
description: >-
  Noh is a Brazilian consumer fintech (neobank) founded in November 2021 by Ana
  Zucato and Octavio Turra, headquartered in Sao Paulo, SP. Noh pioneered
  Brazil's first joint account and shared card for couples, letting two partners
  manage money together with equal permissions, real-time expense visibility,
  automatic categorization, and a shared spending limit based on combined income.
  Products include a joint checking account, a shared Visa card (prepaid and
  credit), and payments via Pix, boleto, and card, plus joint investing. It is a
  consumer mobile app (iOS and Android) with no public developer API, developer
  portal, or documentation surface at this time. Backed by Kindred Ventures and
  other investors; added to the API Evangelist network as a portfolio-lead
  company profile.
